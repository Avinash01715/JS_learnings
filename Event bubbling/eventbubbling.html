<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eventbubbling</title>
    <style>
        .child{
            background-color: rgb(182, 217, 248);
            border: 2px solid black;
            margin: 14px;
            padding: 14px;
            cursor: pointer;
        }
        .childContainer{
            
            border: 2px solid black;
            margin: 14px;
            padding: 14px;
        }
        .container{
            background-color: rgb(60, 148, 225);
            border: 2px solid black;
            margin: 14px;
            padding: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="childContainer">
            <div class="child">
                I am a child
            </div>
        </section>
    </div>
   
    <script>
        document.querySelector(".child").addEventListener("click", (e)=>{
             e.stopPropagation()
            alert("child was clicked")
        })
        // document.querySelector(".childContainer").addEventListener("click", (e)=>{
        //     e.stopPropagation()
        //     alert("childContainer was clicked")
        // })
        document.querySelector(".container").addEventListener("click", (e)=>{
             e.stopPropagation()
            alert("container was clicked")
        })
         
        function getRandomColor(){
            let v1 = Math.ceil(0 + Math.random()*245)
            let v2 = Math.ceil(0 + Math.random()*245)
            let v3 = Math.ceil(0 + Math.random()*245)
            return `rgb(${v1},${v2},${v3})`
        }

    //     setInterval(()=>{
    //    let a = document.querySelector(".childContainer").style.background = getRandomColor();
    

    // }, 50000);
        setTimeout(()=>{
 let a = document.querySelector(".childContainer").style.background = getRandomColor();
    }, 3000);

    </script>

</body>
</html>
